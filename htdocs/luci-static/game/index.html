<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1420">
<title>🎮 怀旧游戏站</title>
<link rel="stylesheet" href="game.css?v=20261017c">
</head>
<body class="rg-lib">

<header class="rg-top">
	<div class="rg-brand">🎮 <span>怀旧游戏站</span></div>
	<div class="rg-tabs">
		<button class="rg-tab on" data-view="all">全部</button>
		<button class="rg-tab" data-view="recent">最近</button>
		<button class="rg-tab" data-view="fav">收藏</button>
	</div>
	<input id="rg-q" class="rg-input rg-search" type="search" placeholder="搜索游戏…">
	<button id="rg-refresh" class="rg-btn" title="重新扫描">↻</button>
</header>

<div id="rg-chips" class="rg-chips"></div>

<main id="rg-grid" class="rg-grid"></main>
<div id="rg-empty" class="rg-empty" hidden></div>

<footer class="rg-foot">
	<span id="rg-stat"></span>
	<span class="rg-sp"></span>
	<a href="/cgi-bin/luci/admin/services/game/settings" class="rg-link">⚙ 设置</a>
</footer>

<script src="lib.js?v=20261017c"></script>
<script src="library.js?v=20261017c"></script>
<script>
/* ★ 内嵌模式：被 LuCI 用 iframe 套住时，藏掉重复的「设置」入口 ✓（LuCI 菜单里已经有了 ✓）*/
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('rg-embed');
</script>
</body>
</html>
